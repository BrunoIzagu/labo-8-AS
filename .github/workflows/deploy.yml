name: Deploy to GKE

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/as-laboratorio-8-web:latest ./app

    - name: Push image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/as-laboratorio-8-web:latest

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        project_id: <TU_PROJECT_ID>
        workload_identity_provider: <URL-GRUPO>
        service_account: <MAIL-servicio>

    - name: Get GKE credentials
      uses: google-github-actions/get-gke-credentials@v3
      with:
        cluster_name: <TU_CLUSTER>
        location: <TU_REGION>

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f k8s/

    - name: Restart deployment
      run: kubectl rollout restart deployment web
