apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: <TU-USUARIO-DH>/as-laboratorio-8-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
